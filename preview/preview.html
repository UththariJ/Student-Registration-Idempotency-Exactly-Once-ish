function once(u,key,action,payload,fn){if(!key)return{s:400,b:{message:'Idempotency-Key header required'}};const k=u.id+':'+key,h=JSON.stringify(payload),p=D.idem[k];let o;

const lost=drop>0&&o.s<300&&!o.replay;D.log.push({id:ids.l++,ts:now(),who:u.username,action,k:key,outcome:lost?'SAVED — response lost':o.replay?'REPLAYED stored response':o.s<300?'PROCESSED':'REJECTED '+o.s});

let e;

if(a==='registrations'){if(e=E('student'))return e;
 if(m==='POST'){const code=b.courseCode,sid=u.id,r=once(u,h['Idempotency-Key'],'REGISTER '+code,{sid,code},()=>{const x=cr(code);if(!x)return{s:404,b:{message:'Course not found'}};if(act(sid).some(g=>g.course_code===code))return{s:409,b:{message:'You are already registered for this course.'}};if(x.available<=0)return{s:409,b:{message:'This course is full.'}};x.available--;const ref=rnd('REG');D.regs.push({id:ids.g++,ref,student_id:sid,course_code:code,status:'Registered',created_at:now()});return{s:201,b:{message:'Registration confirmed.',ref,courseCode:code}}});return R(r.s,r.b)}
 const g=act(u.id).find(x=>x.id===id);if(!g)return R(404,{message:'Registration not found'});g.status='Cancelled';cr(g.course_code).available++;return R(200,{message:'Course dropped; seat released.'})}
if(a==='my'){if(e=E('student'))return e;
 if(c==='registrations')return R(200,act(u.id).map(g=>({id:g.id,ref:g.ref,course_code:g.course_code,name:cr(g.course_code)?.name,credits:cr(g.course_code)?.credits})));
 if(c==='content')return R(200,D.content.filter(x=>act(u.id).some(g=>g.course_code===x.course_code)).map(x=>{const s=D.subs.find(y=>y.content_id===x.id&&y.student_id===u.id);return{...x,sref:s?.ref,grade:s?.grade,feedback:s?.feedback}}).sort((x,y)=>(x.due?0:1)-(y.due?0:1)||(x.due||'').localeCompare(y.due||'')||x.id-y.id));
 if(d==='seen'){D.notes.filter(n=>n.user_id===u.id).forEach(n=>n.seen=1);return R(200,{ok:1})}return R(200,D.notes.filter(n=>n.user_id===u.id).reverse())}

 const ref=rnd('SUB');D.subs.push({id:ids.s++,content_id:id,student_id:u.id,text,ref,grade:null,feedback:''});note(u.id,`✅ Your assignment "${x.title}" was submitted successfully. Reference ${ref}.`);return{s:201,b:{message:'Assignment submitted successfully.',ref}}});return R(r.s,r.b)}
if(a==='lecturer'){if(e=E('lecturer'))return e;
 if(c==='courses')return R(200,D.courses.filter(x=>x.lecturer_id===u.id).map(x=>({...x,students:act2(x.code),content:D.content.filter(y=>y.course_code===x.code).map(y=>({...y,subs:D.subs.filter(s=>s.content_id===y.id).length}))})));
 const x=D.content.find(y=>y.id===+d);if(!x||!own(u,x.course_code))return R(403,{message:'Not your course'});return R(200,{content:x,subs:D.subs.filter(s=>s.content_id===x.id).map(s=>({...s,student:nm(s.student_id)}))})}
if(a==='content'){if(e=E('lecturer'))return e;if(!own(u,b.courseCode))return R(403,{message:'That is not your course'});if(!b.title)return R(400,{message:'Type and title are required'});D.content.push({id:ids.c++,course_code:b.courseCode,type:b.type,title:b.title,body:b.body||'',due:b.due||null});return R(201,{message:'Added'})}
if(a==='submissions'){if(e=E('lecturer'))return e;const s=D.subs.find(y=>y.id===id),x=s&&D.content.find(y=>y.id===s.content_id);if(!s||!own(u,x.course_code))return R(403,{message:'Not your course'});const g=+b.grade;if(!(g>=0&&g<=100))return R(400,{message:'Grade must be 0–100'});s.grade=g;s.feedback=b.feedback||'';note(s.student_id,`📝 "${x.title}" was marked: ${g}/100.`);return R(200,{message:'Saved'})}

  act(id).forEach(g=>cr(g.course_code).available++);D.regs=D.regs.filter(g=>g.student_id!==id);D.courses.forEach(x=>{if(x.lecturer_id===id)x.lecturer_id=null});D.users=D.users.filter(x=>x.id!==id);return R(200,{message:'User removed'})}

<script>
let P=location.hash.slice(1)||'student';const $=s=>document.querySelector(s),ROLES=['student','lecturer','admin'],E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,tab,pend={},D={},cm=new Date(),marking=null;
const setAc=()=>document.documentElement.style.setProperty('--ac',{student:'#7c6cff',lecturer:'#1fb98a',admin:'#ff9f43'}[P]||'#7c6cff');
const toast=t=>{$('#toast').textContent=t;$('#toast').className='s';setTimeout(()=>$('#toast').className='',3200)};

function boot(){setAc();S=JSON.parse(sessionStorage['s_'+P]||'null');if(!ROLES.includes(P))return $('#app').innerHTML=`<div class="login card"><h1>🎓 UniReg</h1><p class="how">Choose your portal</p>${ROLES.map(r=>`<p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin:8px 0" href="#${r}">${r[0].toUpperCase()+r.slice(1)} portal</a></p>`).join('')}</div>`;
 if(!S||S.user.role!==P)return $('#app').innerHTML=`<div class="login card"><h1>🎓 UniReg <small>${P} portal</small></h1><label>Username</label><input id="u" value="${DEMO[P].split(' / ')[0]}" onkeydown="event.key=='Enter'&&login()"><label>Password</label><input id="p" type="password" value="${DEMO[P].split(' / ')[1]}" onkeydown="event.key=='Enter'&&login()"><div class="row"><button class="btn" onclick="login()">Sign in</button></div><p class="how">Demo account: <b>${DEMO[P]}</b></p><p class="how">Other portals: ${ROLES.filter(x=>x!==P).map(x=>`<a href="#${x}">${x}</a>`).join(' · ')}</p></div>`;
 tab=tab||TABS[P][0][0];$('#app').innerHTML=`<header><h1>🎓 UniReg <small>${P}</small></h1><div class="row" style="margin:0"><span>👤 ${E(S.user.name)} <span id="bell"></span></span><button class="btn g" onclick="sessionStorage.removeItem('s_'+P);boot()">Sign out</button></div></header><nav>${TABS[P].map(([k,l])=>`<button data-k="${k}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main id="v"></main>`;go(tab);bell()}

async function bell(){if(P!=='student')return;const n=(await api('GET','/api/my/notifications')).j.filter(x=>!x.seen).length;$('#bell').innerHTML=n?`<span class="pill f">🔔 ${n}</span>`:''}

 try{const r=await api('POST',url,body,{'Idempotency-Key':p.key});delete pend[k];toast(r.s<300?'✅ '+(r.j.replayed?'Already confirmed — ':'')+okMsg(r.j):'❌ '+r.j.message)}catch{p.state='lost'}

 return`<div class="item"><b>${ICON[x.type]} ${E(x.title)}</b> ${x.due?`<small>· due ${x.due}</small>`:''}<p class="how">${E(x.body)}</p>${a}</div>`};

const val=ids=>Object.fromEntries(ids.map(i=>[i,$('#'+i).value]));

 const a=c.myref?`<span class="pill a">✓ Registered · ${c.myref}</span>`:p?.state==='lost'?`<div class="warn">We couldn't confirm your registration.</div><button class="btn" onclick="reg('${c.code}')">↻ Retry</button>`:p?`<button class="btn" disabled>Registering…</button>`:c.available?`<button class="btn" onclick="reg('${c.code}')">Register</button>`:`<span class="pill f">Course full</span>`;
 return`<div class="card"><small>${c.code} · ${c.credits} credits</small><h2>${E(c.name)}</h2><small>👤 ${E(c.lecturer||'TBA')}</small><div class="bar"><i style="width:${u/c.capacity*100}%"></i></div><small>${c.available} of ${c.capacity} seats available</small><div class="row">${a}</div></div>`}).join('')}</div>`},

async cal(){const ct=(await api('GET','/api/my/content')).j.filter(x=>x.due),y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="background:none"></div>'.repeat(f);
 for(let d=1;d<=n;d++){const s=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;c+=`<div><b>${d}</b>${ct.filter(x=>x.due===s).map(x=>`<span class="ev ${x.sref?'done':x.type}" title="${E(x.title)}">${E(x.title)}</span>`).join('')}</div>`}
 return`<div class="card"><div class="row" style="justify-content:space-between;margin:0 0 10px"><button class="btn g" onclick="cmv(-1)">‹</button><h2>${cm.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button class="btn g" onclick="cmv(1)">›</button></div><div class="cal">${c}</div></div><div class="card"><h2>Upcoming deadlines</h2>${ct.map(x=>`<div class="item">${ICON[x.type]} <b>${E(x.title)}</b> <small>${x.course_code} · ${x.due}</small> ${x.sref?'<span class="pill a">Submitted</span>':'<span class="pill f">Pending</span>'}</div>`).join('')||'<p class="how">Nothing due.</p>'}</div>`},
async notes(){const n=(await api('GET','/api/my/notifications')).j;await api('POST','/api/my/notifications/seen');bell();return`<div class="card"><h2>Notifications</h2>${n.map(x=>`<div class="item">${E(x.message)} <small>${x.created_at}</small></div>`).join('')||'<p class="how">No notifications yet.</p>'}</div>`},

async lcourses(){const cs=(await api('GET','/api/lecturer/courses')).j;let m='';if(marking){const d=(await api('GET','/api/lecturer/submissions/'+marking)).j;
 m=`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h2>Marking · ${E(d.content?.title)}</h2><button class="btn g" onclick="mk(null)">Close</button></div><table><tr><th>Student</th><th>Answer</th><th>Mark /100</th><th>Feedback</th><th></th></tr>${(d.subs||[]).map(s=>`<tr><td>${E(s.student)}<br><small class="mono">${s.ref}</small></td><td>${E(s.text)}</td><td><input id="g${s.id}" type="number" value="${s.grade??''}" style="width:70px"></td><td><input id="f${s.id}" value="${E(s.feedback)}"></td><td><button class="btn" onclick="act('PUT','/api/submissions/${s.id}/grade',{grade:$('#g${s.id}').value,feedback:$('#f${s.id}').value})">Save</button></td></tr>`).join('')||'<tr><td colspan=5>No submissions yet.</td></tr>'}</table></div>`}
 return m+cs.map(c=>`<div class="card"><h2>${c.code} · ${E(c.name)}</h2><small>${c.students.length} enrolled · ${c.capacity-c.available}/${c.capacity} seats</small><p>${chips(c.students.map(s=>s.name+' ('+s.username+')'))||'<small>No students yet</small>'}</p>${c.content.map(x=>`<div class="item">${ICON[x.type]} <b>${E(x.title)}</b> <small>${x.due||''}</small> ${x.type==='assignment'?`<button class="btn g" onclick="mk(${x.id})">Mark (${x.subs})</button>`:''}</div>`).join('')}</div>`).join('')||'<div class="card">No courses assigned to you.</div>'},
async add(){const cs=(await api('GET','/api/lecturer/courses')).j;return`<div class="card"><h2>Add lecture note, quiz or assignment</h2><label>Course</label><select id="ac">${cs.map(c=>`<option value="${c.code}">${c.code} — ${E(c.name)}</option>`).join('')}</select><label>Type</label><select id="at"><option value="note">Lecture note</option><option value="quiz">Quiz</option><option value="assignment">Assignment</option></select><label>Title</label><input id="ati"><label>Details</label><textarea id="ab"></textarea><label>Due date (quiz / assignment)</label><input id="ad" type="date"><div class="row"><button class="btn" onclick="act('POST','/api/content',{courseCode:$('#ac').value,type:$('#at').value,title:$('#ati').value,body:$('#ab').value,due:$('#ad').value})">Publish</button></div></div>`},

async users(){const u=(await api('GET','/api/admin/users')).j,t=r=>`<table><tr><th>Username</th><th>Name</th><th>Email</th><th></th></tr>${u.filter(x=>x.role===r).map(x=>`<tr><td>${x.username}</td><td>${E(x.name)}</td><td>${E(x.email)}</td><td><button class="btn r" onclick="del('/api/admin/users/${x.id}')">✕</button></td></tr>`).join('')}</table>`;
 return`<div class="grid"><div class="card"><h2>Students</h2>${t('student')}</div><div class="card"><h2>Lecturers</h2>${t('lecturer')}</div></div><div class="card"><h2>Add user</h2><div class="row"><select id="nr"><option>student</option><option>lecturer</option></select><input id="nu" placeholder="Username / ID"><input id="nn" placeholder="Full name"><input id="ne" placeholder="Email"><input id="np" placeholder="Password"><button class="btn" onclick="act('POST','/api/admin/users',{role:$('#nr').value,username:$('#nu').value,name:$('#nn').value,email:$('#ne').value,password:$('#np').value})">Add</button></div></div>`},
async acourses(){const[c,u]=(await Promise.all([api('GET','/api/courses'),api('GET','/api/admin/users')])).map(x=>x.j),lec=u.filter(x=>x.role==='lecturer'),lo=s=>`<option value="">— none —</option>`+lec.map(l=>`<option value="${l.id}" ${l.id==s?'selected':''}>${E(l.name)}</option>`).join('');
 return`<div class="card"><h2>Courses, seat limits & lecturers</h2><table><tr><th>Course</th><th>Enrolled</th><th>Seat limit</th><th>Lecturer</th><th></th></tr>${c.map(x=>`<tr><td><b>${x.code}</b><br><small>${E(x.name)}</small></td><td>${x.capacity-x.available}</td><td><input id="cp${x.code}" type="number" value="${x.capacity}" style="width:80px"></td><td><select id="lc${x.code}">${lo(x.lecturer_id)}</select></td><td><button class="btn" onclick="act('PUT','/api/admin/courses/${x.code}',{capacity:$('#cp${x.code}').value,lecturer_id:$('#lc${x.code}').value})">Save</button> <button class="btn r" onclick="del('/api/admin/courses/${x.code}')">✕</button></td></tr>`).join('')}</table></div>
 <div class="card"><h2>Add course</h2><div class="row"><input id="xc" placeholder="Code"><input id="xn" placeholder="Name"><input id="xr" type="number" placeholder="Credits"><input id="xp" type="number" placeholder="Seats"><select id="xl">${lo()}</select><button class="btn" onclick="act('POST','/api/admin/courses',{code:$('#xc').value,name:$('#xn').value,credits:$('#xr').value,capacity:$('#xp').value,lecturer_id:$('#xl').value})">Add</button></div></div>`},
async regs(){const[g,c]=(await Promise.all([api('GET','/api/admin/registrations'),api('GET','/api/courses')])).map(x=>x.j),f=D.f||'',rows=g.filter(x=>!f||x.course_code===f);
 return`<div class="card"><div class="row" style="margin:0 0 10px"><h2 style="margin:0">Registrations & class lists</h2><select onchange="D.f=this.value;go('regs')" style="max-width:260px"><option value="">All courses</option>${c.map(x=>`<option ${x.code===f?'selected':''} value="${x.code}">${x.code} (${x.capacity-x.available}/${x.capacity})</option>`).join('')}</select></div><table><tr><th>Ref</th><th>Student</th><th>Course</th><th>Registered at</th></tr>${rows.map(x=>`<tr><td class="mono">${x.ref}</td><td>${E(x.student)} <small>${x.username}</small></td><td>${x.course_code} <small>${E(x.course)}</small></td><td>${x.created_at}</td></tr>`).join('')||'<tr><td colspan=4>No registrations.</td></tr>'}</table></div>`},
async diag(){const d=(await api('GET','/api/admin/diagnostics')).j,t=d.totals;
 return`<div class="stats">${[['Active registrations',t.registrations],['Idempotency keys',t.keys],['Duplicates absorbed',t.duplicates],['Responses lost',t.lost]].map(([l,v])=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('')}</div>
 <div class="card"><h2>Failure simulation</h2><p class="how">Arm the server, then register (or submit an assignment) in the student portal. The server <b>saves the data</b> but cuts the connection before replying. The student sees “couldn't confirm”, presses Retry, and gets the original confirmation.</p><div class="row"><button class="btn o" onclick="arm(1)">💥 Lose next response</button><button class="btn g" onclick="arm(0)">Disarm</button><button class="btn g" onclick="go('diag')">↻ Refresh</button><b>${d.armed?'⚠️ ARMED':'Disarmed'}</b><button class="btn r" onclick="act('POST','/api/admin/reset')">Reset demo data</button></div></div>
 <div class="card"><h2>Seat consistency (capacity − available = active registrations)</h2><table><tr><th>Course</th><th>Capacity</th><th>Available</th><th>Active regs</th><th></th></tr>${d.consistency.map(c=>`<tr><td>${c.code}</td><td>${c.capacity}</td><td>${c.available}</td><td>${c.active}</td><td><span class="pill ${c.ok?'a':'f'}">${c.ok?'✓ consistent':'✗ mismatch'}</span></td></tr>`).join('')}</table></div>
 <div class="grid"><div class="card"><h2>Idempotency store</h2><table><tr><th>Key (user:key)</th><th>Status</th><th>Replays</th></tr>${d.idem.map(x=>`<tr><td class="mono">${x.k}</td><td>${x.status}</td><td>${x.hits}</td></tr>`).join('')||'<tr><td colspan=3>Empty</td></tr>'}</table></div>
 <div class="card"><h2>Request log</h2><table><tr><th>Time</th><th>User</th><th>Action</th><th>Outcome</th></tr>${d.log.map(x=>`<tr><td class="mono">${x.ts.slice(11)}</td><td>${x.who}</td><td>${E(x.action)}<br><small class="mono">${E(x.k)}</small></td><td><span class="pill ${x.outcome.startsWith('PROC')?'a':x.outcome.startsWith('REJ')?'f':'c'}">${x.outcome}</span></td></tr>`).join('')}</table></div></div>`}
};
